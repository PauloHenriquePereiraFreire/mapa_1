<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Removido o user-scalable=no para permitir que o usuário dê zoom se precisar ler a legenda -->
    <meta name="viewport" content="initial-scale=1, maximum-scale=2, width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">
    
    <style>
        html, body { background-color: #ffffff; }
        .ol-control > * { background-color: #f8f8f8!important; color: #444444!important; border-radius: 0px; }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder { color: #444444!important; }
        .search-layer-input-search { background-color: #f8f8f8!important; }
        .ol-control > *:focus, .ol-control >*:hover { background-color: rgba(248, 248, 248, 0.7)!important; }
        .ol-control { background-color: rgba(255,255,255,.4) !important; padding: 2px !important; }
        
        html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }
        
        /* Estilos do Título Principal */
        .map-title {
            text-align: center; 
            font-family: Arial, sans-serif; 
            position: absolute; 
            z-index: 9999; 
            width: 100%; 
            color: #FF0000;
            top: 10px;
            margin: 0;
            font-size: 24px;
            text-shadow: 1px 1px 2px white; /* Melhora leitura sobre o mapa */
        }

        /* Estilos da Legenda */
        .map-legend {
            position: absolute; 
            top: 45px; 
            right: 15px; 
            z-index: 9999; 
            font-family: Arial, sans-serif; 
            color: #000000; 
            margin: 0; 
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 8px;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        /* Caixa de Informações Inferior */
        #caixa-info {
            position: absolute; 
            bottom: 15px; 
            left: 15px; 
            z-index: 1000; 
            background: white; 
            padding: 8px 12px; 
            border-radius: 4px; 
            font-family: Arial, sans-serif; 
            font-size: 14px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            max-width: 80%; /* Evita que estoure a tela do celular */
        }

        /* 📱 REGRAS EXCLUSIVAS PARA CELULAR (Telas de até 768px de largura) */
        @media (max-width: 768px) {
            .map-title {
                font-size: 18px; /* Diminui o título no celular */
                top: 5px;
            }
            .map-legend {
                font-size: 12px; /* Diminui a legenda */
                top: 35px; /* Empurra para baixo do título reduzido */
                right: 5px;
                padding: 3px 6px;
            }
            #caixa-info {
                font-size: 12px;
                bottom: 5px;
                left: 5px;
                max-width: 90%;
            }
            /* Aumenta o tamanho dos botões de zoom do OpenLayers para facilitar o toque */
            .ol-control button {
                width: 1.8em !important;
                height: 1.8em !important;
                font-size: 16px !important;
            }
        }
    </style>
    <title>Mapa do Paraná</title>
</head>
<body>
    <h1 class="map-title">Mapa do Paraná</h1>
    <h2 class="map-legend">Legenda</h2>
    
    <div id="map">
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
    </div>
    
    <div id="caixa-info">Texto de informações do mapa</div>

    <script src="resources/qgis2web_expressions.js"></script>
    <script src="resources/proj4.js"></script>
    <script>proj4.defs('EPSG:31982','+proj=utm +zone=22 +south +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs');</script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>
    <script src="resources/olms.js"></script>
    <script src="layers/testeIFC_1.js"></script>
    <script src="styles/testeIFC_1_style.js"></script>
    <script src="./layers/layers.js" type="text/javascript"></script>
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>
</body>
</html>
