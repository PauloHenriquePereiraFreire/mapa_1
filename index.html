<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1, maximum-scale=2, width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">
    
    <style>
        html, body { background-color: #ffffff; }
        .ol-control > * { background-color: #f8f8f8!important; color: #444444!important; border-radius: 0px; }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder { color: #444444!important; }
        .search-layer-input-search { background-color: #f8f8f8!important; }
        .ol-control > *:focus, .ol-control >*:hover { background-color: rgba(248, 248, 248, 0.7)!important; }
        .ol-control { background-color: rgba(255,255,255,.4) !important; padding: 2px !important; }
        
        html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }
        
        /* 🗺️ TÍTULO DO MAPA */
        .map-title {
            text-align: center !important; 
            font-family: Arial, sans-serif !important; 
            position: absolute !important; 
            z-index: 9999 !important; 
            width: 100% !important; 
            color: #FF0000 !important;
            top: 10px !important;
            margin: 0 !important;
            font-size: 24px !important;
            pointer-events: none !important;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff !important;
        }

        /* 📋 CAIXA DE INFORMAÇÕES */
        #caixa-info {
            position: absolute !important; 
            bottom: 15px !important; 
            left: 15px !important; 
            z-index: 1000 !important; 
            background: white !important; 
            padding: 8px 12px !important; 
            border-radius: 4px !important; 
            font-family: Arial, sans-serif !important; 
            font-size: 14px !important; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2) !important; 
            max-width: 80% !important;
        }

        /* 🛠️ AJUSTE FORÇADO DO BOTÃO DA LEGENDA (LAYER SWITCHER) */
        .layer-switcher {
            top: 40px !important; 
            right: 15px !important;
        }

        /* Injeta a palavra "Legenda" antes das setinhas grudada no próprio botão */
        .layer-switcher button::before {
            content: "Legenda" !important;
            position: absolute !important;
            right: 100% !important; /* Coloca o texto exatamente à esquerda do botão */
            top: 50% !important;
            transform: translateY(-50%) !important; /* Centraliza verticalmente na mesma linha */
            margin-right: 8px !important; /* Distância entre a palavra e a setinha */
            color: #000000 !important;
            font-family: Arial, sans-serif !important;
            font-size: 16px !important;
            font-weight: bold !important;
            white-space: nowrap !important;
        }

        /* Garante que o botão permita ver o texto injetado fora dos limites dele */
        .layer-switcher button {
            overflow: visible !important;
            position: relative !important;
        }

        /* Corrige o posicionamento da caixa de itens quando aberta */
        .layer-switcher .panel {
            margin-top: 5px !important; /* Encaixe perfeito logo abaixo do botão */
            background-color: rgba(255, 255, 255, 0.95) !important;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2) !important;
            border-radius: 4px !important;
            padding: 10px !important;
        }

        /* Remove duplicidades ocultando o título interno padrão */
        .layer-switcher h2, 
        .layer-switcher .panel h2 {
            display: none !important;
        }

        /* 📱 AJUSTES MOBILE (CELULAR) */
        @media (max-width: 768px) {
            .map-title {
                font-size: 18px !important;
                top: 5px !important;
            }
            .layer-switcher {
                top: 38px !important;
                right: 10px !important;
            }
            .layer-switcher button::before {
                font-size: 14px !important; /* Diminui a palavra no celular */
                margin-right: 6px !important;
            }
            #caixa-info {
                font-size: 12px !important;
                bottom: 8px !important;
                left: 8px !important;
                max-width: 90% !important;
            }
        }
    </style>
    <title>Mapa do Paraná</title>
</head>
<body>
    <h1 class="map-title">Mapa do Paraná</h1>
    
    <!-- O H2 de legenda antigo foi removido pois agora o CSS injeta a palavra direto no botão -->
    <div id="map">
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
    </div>
    
    <div id="caixa-info">Texto de informações do mapa</div>

    <script src="resources/qgis2web_expressions.js"></script>
    <script src="resources/proj4.js"></script>
    <script>proj4.defs('EPSG:31982','+proj=utm +zone=22 +south +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs');</script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>
    <script src="resources/olms.js"></script>
    <script src="layers/testeIFC_1.js"></script>
    <script src="styles/testeIFC_1_style.js"></script>
    <script src="./layers/layers.js" type="text/javascript"></script>
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>
</body>
</html>
