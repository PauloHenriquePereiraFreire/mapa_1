<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1, maximum-scale=2, width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">
    
    <style>
        html, body { background-color: #ffffff; }
        .ol-control > * { background-color: #f8f8f8!important; color: #444444!important; border-radius: 0px; }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder { color: #444444!important; }
        .search-layer-input-search { background-color: #f8f8f8!important; }
        .ol-control > *:focus, .ol-control >*:hover { background-color: rgba(248, 248, 248, 0.7)!important; }
        .ol-control { background-color: rgba(255,255,255,.4) !important; padding: 2px !important; }
        
        html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }
        
        /* 🗺️ TÍTULO DO MAPA Fixado no topo */
        .map-title {
            text-align: center; 
            font-family: Arial, sans-serif; 
            position: absolute; 
            z-index: 9999; 
            width: 100%; 
            color: #FF0000;
            top: 10px;
            margin: 0;
            font-size: 24px;
            pointer-events: none; /* Garante que o título não bloqueie cliques no mapa atrás dele */
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; /* Contorno branco para legibilidade */
        }

        /* 📋 CAIXA DE INFORMAÇÕES INFERIOR */
        #caixa-info {
            position: absolute; 
            bottom: 15px; 
            left: 15px; 
            z-index: 1000; 
            background: white; 
            padding: 8px 12px; 
            border-radius: 4px; 
            font-family: Arial, sans-serif; 
            font-size: 14px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            max-width: 80%;
        }

        /* 🛠️ CORREÇÃO E ALINHAMENTO DA LEGENDA (LAYER SWITCHER) */
        /* Move o container do botão e do painel para baixo do título */
        .layer-switcher {
            top: 45px !important; 
            right: 10px !important;
        }

        /* Corrige o alinhamento da palavra "Legenda" com o conteúdo de dentro */
        .layer-switcher h2 {
            font-family: Arial, sans-serif !important;
            font-size: 14px !important;
            font-weight: bold !important;
            margin: 0 0 8px 0 !important;
            padding: 0 0 4px 0 !important;
            border-bottom: 1px solid #ddd;
            text-align: left !important; /* Alinha o texto à esquerda igual aos itens */
        }

        /* Estiliza o painel quando ele abre */
        .layer-switcher .panel {
            background-color: rgba(255, 255, 255, 0.95) !important;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2) !important;
            border-radius: 4px !important;
            padding: 10px !important;
        }

        /* 📱 AJUSTES EXCLUSIVOS PARA TELAS MENORES (CELULAR) */
        @media (max-width: 768px) {
            .map-title {
                font-size: 18px; /* Título menor para não ocupar espaço precioso */
                top: 8px;
            }
            /* Empurra a legenda ainda mais para baixo para dar folga ao título no celular */
            .layer-switcher {
                top: 40px !important;
                right: 5px !important;
            }
            #caixa-info {
                font-size: 12px;
                bottom: 8px;
                left: 8px;
                max-width: 90%;
            }
        }
    </style>
    <title>Mapa do Paraná</title>
</head>
<body>
    <!-- Removido o H2 antigo que estava solto e desalinhado -->
    <h1 class="map-title">Mapa do Paraná</h1>
    
    <div id="map">
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
    </div>
    
    <div id="caixa-info">Texto de informações do mapa</div>

    <script src="resources/qgis2web_expressions.js"></script>
    <script src="resources/proj4.js"></script>
    <script>proj4.defs('EPSG:31982','+proj=utm +zone=22 +south +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs');</script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>
    <script src="resources/olms.js"></script>
    <script src="layers/testeIFC_1.js"></script>
    <script src="styles/testeIFC_1_style.js"></script>
    <script src="./layers/layers.js" type="text/javascript"></script>
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>
</body>
</html>
